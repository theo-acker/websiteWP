<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail du bien - HASA Promotion</title>
<link rel="icon" type="image/png" href="Images/Logo Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;
    --text-muted: #55554d;
    --prop-color: #1a1a1a; /* remplacée en JS par la couleur du bien */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-green);
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Bande blanche du haut : logo + "voir toutes les propriétés" ---------- */
  .topbar {
    flex: 0 0 auto;
    background-color: var(--bg-cream);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px clamp(20px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .logo {
    height: 32px;
    width: auto;
    display: block;
  }

  .btn-all {
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background-color: var(--bg-green);
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    color: var(--text-dark);
  }

  .btn-all:hover { background-color: #c9dcbe; }

  /* ---------- Zone verte : le reste de la page ---------- */
  .green-area {
    flex: 1 1 auto;
    background-color: var(--bg-green);
  }

  .green-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px clamp(20px, 4vw, 40px) 70px;
  }

  .btn-home {
    display: inline-block;
    background-color: #ffffff;
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 22px;
    margin-bottom: 30px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .btn-home:hover { background-color: #f0f0f0; }

  /* ---------- Galerie photo du bien (une seule propriété, plusieurs photos) ---------- */
  .gallery {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 34px;
  }

  .photo-frame {
    flex: 1 1 auto;
    aspect-ratio: 4 / 3;
    max-height: 56vh;
    background-color: #ffffff;
    border: 6px solid var(--prop-color);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .gallery-arrow {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: #ffffff;
    border: 2px solid var(--prop-color);
    color: var(--prop-color);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: transform .15s ease;
  }

  .gallery-arrow:hover { transform: scale(1.08); }

  /* ---------- Informations du bien ---------- */
  .info-panel h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 2.4vw + 1rem, 2.3rem);
    margin-bottom: 8px;
  }

  .address {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 26px;
  }

  .specs {
    display: flex;
    flex-wrap: wrap;
    gap: 22px 44px;
    margin-bottom: 22px;
  }

  .spec-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .spec-value {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
  }

  .info-text {
    max-width: 640px;
    line-height: 1.6;
    color: #2c2c26;
  }

  @media (max-width: 600px) {
    .photo-frame { max-height: 40vh; border-width: 4px; }
    .gallery-arrow { width: 38px; height: 38px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

  <div class="page">

    <header class="topbar">
      <div class="topbar-inner">
        <img class="logo" src="Images/HASA Promotion Logo.png" alt="HASA Promotion">
        <button class="btn-all" id="btnAll">Voir toutes les propriétés</button>
      </div>
    </header>

    <div class="green-area">
      <div class="green-inner">

        <a class="btn-home" href="index.html">&larr; Retour à l'accueil</a>

        <section class="gallery">
          <button class="gallery-arrow" id="prevBtn" aria-label="Photo précédente">&lsaquo;</button>
          <div class="photo-frame">
            <img id="mainPhoto" src="" alt="">
          </div>
          <button class="gallery-arrow" id="nextBtn" aria-label="Photo suivante">&rsaquo;</button>
        </section>

        <section class="info-panel">
          <h1 id="propTitle"></h1>
          <p class="address" id="propAddress"></p>

          <div class="specs">
            <div>
              <span class="spec-label">Prix</span>
              <span class="spec-value" id="propPrice"></span>
            </div>
            <div>
              <span class="spec-label">Surface</span>
              <span class="spec-value" id="propSurface"></span>
            </div>
            <div>
              <span class="spec-label">Type de bien</span>
              <span class="spec-value" id="propType"></span>
            </div>
          </div>

          <p class="info-text" id="propInfo"></p>
        </section>

      </div>
    </div>

  </div>

  <script>
    /* =========================================================================
       DONNÉES DES PROPRIÉTÉS
       -> Toutes les valeurs ci-dessous sont des PLACEHOLDERS à remplacer.
       -> "mainImage" = photo personnalisée du bien (1ère photo affichée).
       -> "color"     = couleur associée au bien (cadre de la photo + boutons
          de navigation de cette page).
       -> Les pages ne sont PAS reliées entre elles : depuis cette page on ne
          peut pas aller vers un autre bien, seulement parcourir SES photos.
       ========================================================================= */
    const PROPERTIES = [
      {
        slug: 'rue-de-metz',
        title: 'Rue de Metz',
        address: '00 Rue de Metz, 31000 Toulouse',       // PLACEHOLDER
        price: '000 000 €',                                // PLACEHOLDER
        surface: '00 m²',                                  // PLACEHOLDER
        type: 'Appartement',                               // PLACEHOLDER
        info: 'Informations supplémentaires à compléter.', // PLACEHOLDER
        color: '#22a54c',
        mainImage: 'Images/PPT METZ.png'
      },
      {
        slug: 'rue-tolosane',
        title: 'Rue Tolosane',
        address: '00 Rue Tolosane, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#e3030d',
        mainImage: 'Images/PPT TOLOSANE.jpg'
      },
      {
        slug: 'rue-mage',
        title: 'Rue Mage',
        address: '00 Rue Mage, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Bureau',
        info: 'Informations supplémentaires à compléter.',
        color: '#ffed00',
        mainImage: 'Images/PPT MAGE.png'
      },
      {
        slug: 'impasse-ampere',
        title: 'Impasse Ampère',
        address: '00 Impasse Ampère, 31100 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#d73089',
        mainImage: 'Images/PPT AMPèRE.png'
      },
      {
        slug: 'rue-cany',
        title: 'Rue Cany',
        address: '00 Rue Cany, 31200 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Appartement',
        info: 'Informations supplémentaires à compléter.',
        color: '#bae2fb',
        mainImage: 'Images/PPT Cany.png'
      },
      {
        slug: 'rue-croix-baragnon',
        title: 'Rue Croix Baragnon',
        address: '00 Rue Croix Baragnon, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#036ab3',
        mainImage: 'Images/PPT CROIX BARAGNON.png'
      }
    ];

    /* Photos génériques communes à tous les biens, ajoutées après la photo
       personnalisée dans le parcours des flèches de la galerie. */
    const GENERIC_PHOTOS = [
      'Images/BIENa.png',
      'Images/BIENb.png',
      'Images/BIENc.png',
      'Images/BIENd.png',
      'Images/BIENe.png'
    ];

    function mod(n, m) { return ((n % m) + m) % m; }

    function findIndex(slug) {
      const idx = PROPERTIES.findIndex(p => p.slug === slug);
      return idx === -1 ? 0 : idx;
    }

    const params = new URLSearchParams(window.location.search);
    const property = PROPERTIES[findIndex(params.get('propriete'))];
    const photos = [property.mainImage, ...GENERIC_PHOTOS];
    let photoIndex = 0;

    function updatePhoto() {
      document.getElementById('mainPhoto').src = photos[photoIndex];
      document.getElementById('mainPhoto').alt = property.title + ' - photo ' + (photoIndex + 1);
    }

    function render() {
      document.documentElement.style.setProperty('--prop-color', property.color);

      document.getElementById('propTitle').textContent = property.title;
      document.getElementById('propAddress').textContent = property.address;
      document.getElementById('propPrice').textContent = property.price;
      document.getElementById('propSurface').textContent = property.surface;
      document.getElementById('propType').textContent = property.type;
      document.getElementById('propInfo').textContent = property.info;

      document.title = property.title + ' - HASA Promotion';

      updatePhoto();
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      photoIndex = mod(photoIndex - 1, photos.length);
      updatePhoto();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      photoIndex = mod(photoIndex + 1, photos.length);
      updatePhoto();
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      alert('Vous avez compris le principe');
    });

    render();
  </script>

</body>
</html>
