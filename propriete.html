<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail du bien - HASA Promotion</title>
<link rel="icon" type="image/png" href="Images/Logo Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;
    --text-muted: #6b6b62;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-cream);
  }

  /* ---------- Bandeau haut : retour accueil (gauche) / voir tout (droite) ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px clamp(20px, 4vw, 40px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
  }

  .back-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text-dark);
  }

  .back-link img {
    height: 30px;
    width: auto;
    display: block;
  }

  .back-link span {
    font-weight: 600;
    font-size: 0.9rem;
  }

  .back-link:hover { opacity: 0.65; }

  .btn-all {
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background-color: var(--bg-green);
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    color: var(--text-dark);
  }

  .btn-all:hover { background-color: #c9dcbe; }

  /* ---------- Contenu ---------- */
  .content {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px clamp(20px, 4vw, 40px) 70px;
  }

  /* Galerie : flèche - photo principale - flèche */
  .gallery {
    display: flex;
    align-items: center;
    gap: 14px;
    background-color: var(--bg-green);
    padding: 22px;
  }

  .gallery-arrow {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background-color: #ffffff;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  .gallery-arrow:hover { background-color: #f0f0f0; }

  .main-photo {
    flex: 1 1 auto;
    aspect-ratio: 4 / 3;
    max-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: #ffffff;
  }

  .main-photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Bandeau de vignettes (les 6 biens, navigation directe) */
  .thumbs-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 12px 2px 0;
  }

  .thumb {
    flex: 0 0 auto;
    width: 76px;
    border: none;
    background: none;
    padding: 3px;
    cursor: pointer;
    border-radius: 4px;
    opacity: 0.5;
    box-shadow: 0 0 0 2px transparent;
    transition: opacity .2s ease, box-shadow .2s ease;
  }

  .thumb img {
    width: 100%;
    display: block;
    border-radius: 2px;
  }

  .thumb:hover { opacity: 0.85; }

  .thumb.active {
    opacity: 1;
    box-shadow: 0 0 0 2px var(--thumb-color, var(--text-dark));
  }

  /* Titre + badge couleur + adresse */
  .info-panel {
    padding: 28px 2px 26px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.09);
    margin-bottom: 28px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .title-row h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 2.4vw + 1rem, 2.3rem);
  }

  .color-badge {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
  }

  .address {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 26px;
  }

  .specs {
    display: flex;
    flex-wrap: wrap;
    gap: 22px 44px;
    margin-bottom: 22px;
  }

  .spec-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .spec-value {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
  }

  .info-text {
    max-width: 640px;
    line-height: 1.6;
    color: #333;
  }

  /* Autres photos : simple liste, sans mise en scène */
  .other-photos h2 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 14px;
  }

  .photo-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .photo-list img {
    width: 150px;
    height: 112px;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 600px) {
    .main-photo { max-height: 42vh; }
    .gallery-arrow { width: 36px; height: 36px; font-size: 1.1rem; }
    .photo-list img { width: 42%; height: auto; aspect-ratio: 4/3; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="back-link" href="index.html">
      <img src="Images/HASA Promotion Logo.png" alt="HASA Promotion">
      <span>&larr; Retour à l'accueil</span>
    </a>
    <button class="btn-all" id="btnAll">Voir toutes les propriétés</button>
  </header>

  <main class="content">

    <section class="gallery">
      <button class="gallery-arrow" id="prevBtn" aria-label="Bien précédent">&lsaquo;</button>
      <div class="main-photo">
        <img id="mainPhoto" src="" alt="">
      </div>
      <button class="gallery-arrow" id="nextBtn" aria-label="Bien suivant">&rsaquo;</button>
    </section>

    <div class="thumbs-row" id="thumbsRow"></div>

    <section class="info-panel">
      <div class="title-row">
        <h1 id="propTitle"></h1>
        <span class="color-badge" id="colorBadge"></span>
      </div>
      <p class="address" id="propAddress"></p>

      <div class="specs">
        <div>
          <span class="spec-label">Prix</span>
          <span class="spec-value" id="propPrice"></span>
        </div>
        <div>
          <span class="spec-label">Surface</span>
          <span class="spec-value" id="propSurface"></span>
        </div>
        <div>
          <span class="spec-label">Type de bien</span>
          <span class="spec-value" id="propType"></span>
        </div>
      </div>

      <p class="info-text" id="propInfo"></p>
    </section>

    <section class="other-photos">
      <h2>Autres photos</h2>
      <div class="photo-list" id="photoList"></div>
    </section>

  </main>

  <script>
    /* =========================================================================
       DONNÉES DES PROPRIÉTÉS
       -> Toutes les valeurs ci-dessous sont des PLACEHOLDERS à remplacer.
       -> "mainImage" = photo personnalisée du bien (bandeau vert, page détail).
       -> "cardImage" = même image que celle utilisée dans le carrousel de
          l'accueil (index.html), réutilisée ici comme vignette.
       -> "color" = couleur associée au bien (utilisée pour le badge et le
          contour de la vignette active).
       ========================================================================= */
    const PROPERTIES = [
      {
        slug: 'rue-de-metz',
        title: 'Rue de Metz',
        address: '00 Rue de Metz, 31000 Toulouse',       // PLACEHOLDER
        price: '000 000 €',                                // PLACEHOLDER
        surface: '00 m²',                                  // PLACEHOLDER
        type: 'Appartement',                               // PLACEHOLDER
        info: 'Informations supplémentaires à compléter.', // PLACEHOLDER
        color: '#22a54c',
        mainImage: 'Images/PPT METZ.png',
        cardImage: 'Images/Propriété_2b.png'
      },
      {
        slug: 'rue-tolosane',
        title: 'Rue Tolosane',
        address: '00 Rue Tolosane, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#e3030d',
        mainImage: 'Images/PPT TOLOSANE.jpg',
        cardImage: 'Images/Propriété_3b.png'
      },
      {
        slug: 'rue-mage',
        title: 'Rue Mage',
        address: '00 Rue Mage, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Bureau',
        info: 'Informations supplémentaires à compléter.',
        color: '#ffed00',
        mainImage: 'Images/PPT MAGE.png',
        cardImage: 'Images/Propriété_6b.png'
      },
      {
        slug: 'impasse-ampere',
        title: 'Impasse Ampère',
        address: '00 Impasse Ampère, 31100 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#d73089',
        mainImage: 'Images/PPT AMPèRE.png',
        cardImage: 'Images/Propriété_5b.png'
      },
      {
        slug: 'rue-cany',
        title: 'Rue Cany',
        address: '00 Rue Cany, 31200 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Appartement',
        info: 'Informations supplémentaires à compléter.',
        color: '#bae2fb',
        mainImage: 'Images/PPT Cany.png',
        cardImage: 'Images/Propriété_4b.png'
      },
      {
        slug: 'rue-croix-baragnon',
        title: 'Rue Croix Baragnon',
        address: '00 Rue Croix Baragnon, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#036ab3',
        mainImage: 'Images/PPT CROIX BARAGNON.png',
        cardImage: 'Images/Propriété_1b.png'
      }
    ];

    /* Photos génériques, communes à tous les biens (simple liste). */
    const GENERIC_PHOTOS = [
      'Images/BIENa.png',
      'Images/BIENb.png',
      'Images/BIENc.png',
      'Images/BIENd.png',
      'Images/BIENe.png'
    ];

    function mod(n, m) { return ((n % m) + m) % m; }

    function findIndex(slug) {
      const idx = PROPERTIES.findIndex(p => p.slug === slug);
      return idx === -1 ? 0 : idx;
    }

    function goTo(slug) {
      window.location.href = 'propriete.html?propriete=' + encodeURIComponent(slug);
    }

    function renderThumbs(activeIdx) {
      const row = document.getElementById('thumbsRow');
      row.innerHTML = '';
      PROPERTIES.forEach((p, i) => {
        const thumb = document.createElement('button');
        thumb.className = 'thumb' + (i === activeIdx ? ' active' : '');
        thumb.style.setProperty('--thumb-color', p.color);
        thumb.setAttribute('aria-label', p.title);
        thumb.innerHTML = '<img src="' + p.cardImage + '" alt="' + p.title + '">';
        thumb.addEventListener('click', () => goTo(p.slug));
        row.appendChild(thumb);
      });
    }

    function renderGenericPhotos() {
      const list = document.getElementById('photoList');
      list.innerHTML = '';
      GENERIC_PHOTOS.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = 'Photo du bien';
        list.appendChild(img);
      });
    }

    function render(idx) {
      const prop = PROPERTIES[idx];

      document.getElementById('mainPhoto').src = prop.mainImage;
      document.getElementById('mainPhoto').alt = prop.title;

      document.getElementById('propTitle').textContent = prop.title;
      document.getElementById('colorBadge').style.backgroundColor = prop.color;
      document.getElementById('propAddress').textContent = prop.address;
      document.getElementById('propPrice').textContent = prop.price;
      document.getElementById('propSurface').textContent = prop.surface;
      document.getElementById('propType').textContent = prop.type;
      document.getElementById('propInfo').textContent = prop.info;

      document.title = prop.title + ' - HASA Promotion';

      renderThumbs(idx);
    }

    const params = new URLSearchParams(window.location.search);
    let currentIndex = findIndex(params.get('propriete'));

    render(currentIndex);
    renderGenericPhotos();

    document.getElementById('prevBtn').addEventListener('click', () => {
      goTo(PROPERTIES[mod(currentIndex - 1, PROPERTIES.length)].slug);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      goTo(PROPERTIES[mod(currentIndex + 1, PROPERTIES.length)].slug);
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      alert('Vous avez compris le principe');
    });
  </script>

</body>
</html>
