<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail du bien - HASA Promotion</title>
<link rel="icon" type="image/png" href="Images/Logo Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;
    --text-muted: #55554d;
    --prop-color: #1a1a1a; /* remplacée en JS par la couleur du bien */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-green);
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Bande blanche du haut : logo + "voir toutes les propriétés" ---------- */
  .topbar {
    flex: 0 0 auto;
    background-color: var(--bg-cream);
  }

  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px clamp(20px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .logo {
    height: 32px;
    width: auto;
    display: block;
  }

  .btn-all {
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background-color: #ffffff;
    border: 2px solid var(--text-dark);
    padding: 10px 20px;
    cursor: pointer;
    color: var(--text-dark);
  }

  .btn-all:hover { background-color: #f2f2f2; }

  /* ---------- Zone verte : le reste de la page ---------- */
  .green-area {
    flex: 1 1 auto;
    background-color: var(--bg-green);
  }

  .green-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px clamp(20px, 4vw, 40px) 70px;
  }

  .btn-home {
    display: inline-block;
    background-color: #ffffff;
    color: var(--text-dark);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 22px;
    margin-bottom: 30px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .btn-home:hover { background-color: #f0f0f0; }

  /* ---------- Galerie photo du bien ---------- */
  /* Pas de cadre couleur ni de format imposé : chaque photo garde ses
     propres proportions (on ne "complète" jamais en blanc autour). */
  .gallery {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 34px;
  }

  .gallery-arrow {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: #ffffff;
    border: 2px solid var(--text-dark);
    color: var(--text-dark);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: transform .15s ease;
  }

  .gallery-arrow:hover { transform: scale(1.08); }

  .photo-wrap {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
  }

  .photo-wrap img {
    display: block;
    max-width: 100%;
    max-height: 56vh;
    width: auto;
    height: auto;
    transition: opacity .2s ease;
  }

  .photo-loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(0, 0, 0, 0.15);
    border-top-color: var(--text-dark);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Description du bien : panneau blanc + petites cases colorées ---------- */
  .info-panel {
    background-color: #ffffff;
    padding: clamp(20px, 3vw, 36px);
  }

  .info-panel h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 2.4vw + 1rem, 2.3rem);
    margin-bottom: 8px;
  }

  .address {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  .specs {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
  }

  .spec-box {
    border: 2px solid var(--prop-color);
    padding: 12px 18px;
    min-width: 120px;
  }

  .spec-label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .spec-value {
    font-family: 'League Spartan', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
  }

  .info-text {
    max-width: 640px;
    line-height: 1.6;
    color: #2c2c26;
  }

  @media (max-width: 600px) {
    .photo-wrap { min-height: 180px; }
    .photo-wrap img { max-height: 38vh; }
    .gallery-arrow { width: 38px; height: 38px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

  <div class="page">

    <header class="topbar">
      <div class="topbar-inner">
        <img class="logo" src="Images/HASA Promotion Logo.png" alt="HASA Promotion">
        <button class="btn-all" id="btnAll">Voir toutes les propriétés</button>
      </div>
    </header>

    <div class="green-area">
      <div class="green-inner">

        <a class="btn-home" href="index.html">&larr; Retour à l'accueil</a>

        <section class="gallery">
          <button class="gallery-arrow" id="prevBtn" aria-label="Photo précédente">&lsaquo;</button>

          <div class="photo-wrap">
            <img id="mainPhoto" src="" alt="" style="opacity:0;">
            <div class="photo-loader" id="photoLoader">
              <span class="spinner"></span>
              <span>Chargement de la photo…</span>
            </div>
          </div>

          <button class="gallery-arrow" id="nextBtn" aria-label="Photo suivante">&rsaquo;</button>
        </section>

        <section class="info-panel">
          <h1 id="propTitle"></h1>
          <p class="address" id="propAddress"></p>

          <div class="specs">
            <div class="spec-box">
              <span class="spec-label">Prix</span>
              <span class="spec-value" id="propPrice"></span>
            </div>
            <div class="spec-box">
              <span class="spec-label">Surface</span>
              <span class="spec-value" id="propSurface"></span>
            </div>
            <div class="spec-box">
              <span class="spec-label">Type de bien</span>
              <span class="spec-value" id="propType"></span>
            </div>
          </div>

          <p class="info-text" id="propInfo"></p>
        </section>

      </div>
    </div>

  </div>

  <script>
    /* =========================================================================
       DONNÉES DES PROPRIÉTÉS
       -> Toutes les valeurs ci-dessous sont des PLACEHOLDERS à remplacer.
       -> "mainImage" = photo personnalisée du bien (1ère photo affichée).
       -> "color"     = couleur associée au bien (cadre des petites cases de
          caractéristiques, dans le panneau blanc).
       -> Les pages ne sont PAS reliées entre elles : depuis cette page on ne
          peut pas aller vers un autre bien, seulement parcourir SES photos.
       ========================================================================= */
    const PROPERTIES = [
      {
        slug: 'rue-de-metz',
        title: 'Rue de Metz',
        address: '00 Rue de Metz, 31000 Toulouse',       // PLACEHOLDER
        price: '000 000 €',                                // PLACEHOLDER
        surface: '00 m²',                                  // PLACEHOLDER
        type: 'Appartement',                               // PLACEHOLDER
        info: 'Informations supplémentaires à compléter.', // PLACEHOLDER
        color: '#22a54c',
        mainImage: 'Images/PPT METZ.png'
      },
      {
        slug: 'rue-tolosane',
        title: 'Rue Tolosane',
        address: '00 Rue Tolosane, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#e3030d',
        mainImage: 'Images/PPT TOLOSANE.jpg'
      },
      {
        slug: 'rue-mage',
        title: 'Rue Mage',
        address: '00 Rue Mage, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Bureau',
        info: 'Informations supplémentaires à compléter.',
        color: '#ffed00',
        mainImage: 'Images/PPT MAGE.png'
      },
      {
        slug: 'impasse-ampere',
        title: 'Impasse Ampère',
        address: '00 Impasse Ampère, 31100 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#d73089',
        mainImage: 'Images/PPT AMPèRE.png'
      },
      {
        slug: 'rue-cany',
        title: 'Rue Cany',
        address: '00 Rue Cany, 31200 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Appartement',
        info: 'Informations supplémentaires à compléter.',
        color: '#bae2fb',
        mainImage: 'Images/PPT Cany.png'
      },
      {
        slug: 'rue-croix-baragnon',
        title: 'Rue Croix Baragnon',
        address: '00 Rue Croix Baragnon, 31000 Toulouse',
        price: '000 000 €',
        surface: '00 m²',
        type: 'Maison',
        info: 'Informations supplémentaires à compléter.',
        color: '#036ab3',
        mainImage: 'Images/PPT CROIX BARAGNON.png'
      }
    ];

    /* Photos génériques communes à tous les biens, ajoutées après la photo
       personnalisée dans le parcours des flèches de la galerie. */
    const GENERIC_PHOTOS = [
      'Images/BIENa.png',
      'Images/BIENb.png',
      'Images/BIENc.png',
      'Images/BIENd.png',
      'Images/BIENe.png'
    ];

    function mod(n, m) { return ((n % m) + m) % m; }

    function findIndex(slug) {
      const idx = PROPERTIES.findIndex(p => p.slug === slug);
      return idx === -1 ? 0 : idx;
    }

    const params = new URLSearchParams(window.location.search);
    const property = PROPERTIES[findIndex(params.get('propriete'))];
    const photos = [property.mainImage, ...GENERIC_PHOTOS];
    let photoIndex = 0;

    const mainPhoto = document.getElementById('mainPhoto');
    const photoLoader = document.getElementById('photoLoader');

    function updatePhoto() {
      photoLoader.style.display = 'flex';
      mainPhoto.style.opacity = '0';
      mainPhoto.src = photos[photoIndex];
      mainPhoto.alt = property.title + ' - photo ' + (photoIndex + 1);
    }

    mainPhoto.addEventListener('load', () => {
      photoLoader.style.display = 'none';
      mainPhoto.style.opacity = '1';
    });
    mainPhoto.addEventListener('error', () => {
      photoLoader.style.display = 'none';
    });

    function render() {
      document.documentElement.style.setProperty('--prop-color', property.color);

      document.getElementById('propTitle').textContent = property.title;
      document.getElementById('propAddress').textContent = property.address;
      document.getElementById('propPrice').textContent = property.price;
      document.getElementById('propSurface').textContent = property.surface;
      document.getElementById('propType').textContent = property.type;
      document.getElementById('propInfo').textContent = property.info;

      document.title = property.title + ' - HASA Promotion';

      updatePhoto();
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      photoIndex = mod(photoIndex - 1, photos.length);
      updatePhoto();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      photoIndex = mod(photoIndex + 1, photos.length);
      updatePhoto();
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      alert('Vous avez compris le principe');
    });

    render();
  </script>

</body>
</html>
