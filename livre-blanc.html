<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accès au livre blanc</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #ffffff;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .form-container {
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
  }
  input[type="text"],
  input[type="email"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid #000000;
    font-size: 14px;
    font-family: inherit;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #000000;
    background-color: #ffffff;
    color: #cccccc;
    cursor: not-allowed;
    font-family: inherit;
  }
  button.active {
    background-color: #000000;
    color: #ffffff;
    cursor: pointer;
  }
  #message {
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="form-container">
  <h1>Accès au livre blanc</h1>

  <form id="accessForm" novalidate>
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" autocomplete="off">

    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" name="prenom" autocomplete="off">

    <label for="email">Email</label>
    <input type="text" id="email" name="email" autocomplete="off">

    <button type="button" id="accessBtn" disabled>Accéder au livre blanc</button>
    <div id="message"></div>
  </form>
</div>

<script>
  // === À CONFIGURER ===
  const GOOGLE_SCRIPT_URL = "COLLER_ICI_URL_APPS_SCRIPT"; // ex: https://script.google.com/macros/s/XXXXX/exec
  const LIVRE_BLANC_URL = "livreblanc";
  // =====================

  const nomInput = document.getElementById('nom');
  const prenomInput = document.getElementById('prenom');
  const emailInput = document.getElementById('email');
  const accessBtn = document.getElementById('accessBtn');
  const message = document.getElementById('message');

  function isFormValid() {
    const nomOk = nomInput.value.trim().length > 0;
    const prenomOk = prenomInput.value.trim().length > 0;
    const emailOk = emailInput.value.includes('@') && emailInput.value.trim().length > 0;
    return nomOk && prenomOk && emailOk;
  }

  function checkForm() {
    if (isFormValid()) {
      accessBtn.disabled = false;
      accessBtn.classList.add('active');
    } else {
      accessBtn.disabled = true;
      accessBtn.classList.remove('active');
    }
  }

  [nomInput, prenomInput, emailInput].forEach(input => {
    input.addEventListener('input', checkForm);
  });

  accessBtn.addEventListener('click', function() {
    if (!isFormValid()) return;

    accessBtn.disabled = true;
    message.textContent = "Envoi en cours...";

    const data = {
      nom: nomInput.value.trim(),
      prenom: prenomInput.value.trim(),
      email: emailInput.value.trim()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      message.textContent = "";
      window.open(LIVRE_BLANC_URL, '_blank');
      checkForm();
    })
    .catch(() => {
      message.textContent = "Une erreur est survenue, réessayez.";
      checkForm();
    });
  });
</script>

</body>
</html>
