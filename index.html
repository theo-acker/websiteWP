<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASA Promotion - Livre Blanc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-cream);
  }

  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Bande 1 : blanche, vide */
  .band-white-top {
    flex: 0 0 17vh;
    background-color: var(--bg-cream);
  }

  /* Bande 2 : verte, titre + sous-titre + bouton + logo */
  .hero-section {
    flex: 0 0 50vh;
    background-color: var(--bg-green);
    position: relative;
    z-index: 1;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 40px;
  }

  .hero-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    flex-wrap: wrap;
    margin: 0 auto;
  }

  .logo-wrapper {
    flex: 1 1 400px;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 280px;
    overflow: visible;
  }

  .logo-wrapper img {
    height: 106%;
    width: auto;
    max-width: none;
  }

  .content-wrapper {
    flex: 1 1 400px;
    min-width: 280px;
  }

  .content-wrapper h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: 4.5rem;
    line-height: 1.1;
    margin-bottom: 24px;
  }

  .content-wrapper p {
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 32px;
  }

  .btn-download {
    display: inline-block;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    background-color: #ffffff;
    color: var(--text-dark);
    text-decoration: none;
    border: none;
    padding: 18px 36px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  .btn-download:hover {
    background-color: #f0f0f0;
  }

  /* Bande 3 : blanche, vide */
  .band-white-mid {
    flex: 0 0 15vh;
    background-color: var(--bg-cream);
  }

  /* Bande 4 : verte, flèches de navigation */
  .nav-section {
    flex: 0 0 18vh;
    background-color: var(--bg-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }

  .nav-arrow {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .nav-arrow svg {
    width: 28px;
    height: 28px;
  }

  @media (max-width: 768px) {
    .page {
      height: auto;
      min-height: 100vh;
    }

    .band-white-top {
      flex-basis: 60px;
    }

    .hero-section {
      flex-basis: auto;
      padding: 40px 30px;
    }

    .hero-container {
      height: auto;
      flex-direction: column;
      text-align: center;
    }

    .logo-wrapper {
      height: auto;
    }

    .logo-wrapper img {
      height: auto;
      width: 100%;
      max-width: 400px;
    }

    .content-wrapper h1 {
      font-size: 2.8rem;
    }

    .content-wrapper p {
      margin-left: auto;
      margin-right: auto;
    }

    .band-white-mid {
      flex-basis: 40px;
    }

    .nav-section {
      flex-basis: 90px;
      padding: 20px 30px;
    }
  }

  @media (max-width: 480px) {
    .content-wrapper h1 {
      font-size: 2.2rem;
    }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="band-white-top"></div>

    <section class="hero-section">
      <div class="hero-container">
        <div class="logo-wrapper">
          <img src="Images/Logo.png" alt="HASA Promotion Logo">
        </div>
        <div class="content-wrapper">
          <h1>Jouez. Explorez. Investissez.</h1>
          <p>Découvrez tous nos biens disponibles comme vous n'en avez jamais vu et tentez votre chance pour gagner de nombreux cadeaux.</p>
          <a class="btn-download" href="telecharger.html">Téléchargez le livre blanc</a>
        </div>
      </div>
    </section>

    <div class="band-white-mid"></div>

    <nav class="nav-section">
      <button class="nav-arrow" aria-label="Précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="nav-arrow" aria-label="Suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </nav>

  </div>
</body>
</html>
