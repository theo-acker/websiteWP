<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASA Promotion - Livre Blanc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-cream: #faf9f7;
    --bg-green: #d8e5d1;
    --text-dark: #1a1a1a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Open Sans', sans-serif;
    color: var(--text-dark);
    background-color: var(--bg-cream);
  }

  .page {
    height: 100vh;
    height: 100svh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Bande 1 : blanche, en-tête (logo entreprise + navigation) */
  .band-white-top {
    flex: 0 0 10vh;
    min-height: 0;
    background-color: var(--bg-cream);
    display: flex;
    align-items: center;
    z-index: 2;
    position: relative;
  }

  .header-bar {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 clamp(20px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .brand-logo img {
    height: clamp(24px, 5vh, 44px);
    width: auto;
    display: block;
  }

  /* Placeholder tant que le logo entreprise n'est pas fourni */
  .brand-logo-placeholder {
    border: 1px dashed #b8b8b0;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: clamp(0.65rem, 1.4vh, 0.8rem);
    color: #8a8a80;
    white-space: nowrap;
  }

  .top-nav {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.5vw, 32px);
  }

  .top-nav a {
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.75rem, 1.6vh, 0.95rem);
    color: var(--text-dark);
    text-decoration: none;
    white-space: nowrap;
  }

  .top-nav a:hover {
    opacity: 0.65;
  }

  /* Bande 2 : verte, titre + sous-titre + bouton + logo */
  .hero-section {
    flex: 0 0 57vh;
    min-height: 0;
    background-color: var(--bg-green);
    position: relative;
    z-index: 3;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 clamp(16px, 4vw, 40px);
    min-width: 0;
  }

  .hero-container {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(12px, 3vw, 60px);
    margin: 0 auto;
    min-width: 0;
    min-height: 0;
  }

  .logo-wrapper {
    flex: 1.1 1 0;
    height: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-width: 0;
    overflow: visible;
  }

  .logo-wrapper img {
    width: 100%;
    height: 122%;
    object-fit: contain;
  }

  .content-wrapper {
    flex: 1.3 1 0;
    min-width: 0;
    height: 100%;
    max-height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .content-wrapper h1 {
    font-family: 'League Spartan', sans-serif;
    font-weight: 800;
    font-size: clamp(1.1rem, 3vw + 2.6vh, 4.5rem);
    line-height: 1.1;
    margin-bottom: clamp(6px, 1.5vh, 24px);
  }

  .content-wrapper p {
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 0.6vw + 0.9vh, 1.05rem);
    line-height: 1.5;
    max-width: 480px;
    margin-bottom: clamp(8px, 2vh, 32px);
  }

  .btn-download {
    display: inline-block;
    align-self: flex-start;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.75rem, 0.9vh + 0.4vw, 1rem);
    background-color: #ffffff;
    color: var(--text-dark);
    text-decoration: none;
    border: none;
    padding: clamp(8px, 1.8vh, 18px) clamp(16px, 3vw, 36px);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    white-space: nowrap;
  }

  .btn-download:hover {
    background-color: #f0f0f0;
  }

  /* Bande 3 : blanche, vide */
  .band-white-mid {
    flex: 0 0 15vh;
    min-height: 0;
    background-color: var(--bg-cream);
  }

  /* Bande 4 : verte, flèches de navigation */
  .nav-section {
    flex: 0 0 18vh;
    min-height: 0;
    background-color: var(--bg-green);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
  }

  .nav-arrow {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .nav-arrow svg {
    width: 28px;
    height: 28px;
  }

  @media (max-width: 600px) {
    .hero-section {
      padding: 0 clamp(10px, 3vw, 20px);
    }

    .hero-container {
      gap: clamp(8px, 2vw, 20px);
    }

    .logo-wrapper {
      flex: 1 1 0;
    }

    .content-wrapper {
      flex: 1.5 1 0;
    }

    .nav-section {
      padding: 0 clamp(20px, 6vw, 40px);
    }
  }

  /* Ecrans très bas (mobile en paysage) : on sacrifie le sous-titre
     pour garantir que le titre et le bouton restent visibles */
  @media (max-height: 420px) {
    .content-wrapper p {
      display: none;
    }

    .content-wrapper h1 {
      margin-bottom: clamp(4px, 1vh, 12px);
    }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="band-white-top">
      <div class="header-bar">
        <div class="brand-logo">
          <!-- Remplacez ce placeholder par : <img src="Images/logo-entreprise.png" alt="Logo entreprise"> -->
          <img src="Images/HASA Promotion logo.png" alt="Logo entreprise">
        </div>
        <nav class="top-nav">
          <a href="#">Accueil</a>
          <a href="#">Biens</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </div>

    <section class="hero-section">
      <div class="hero-container">
        <div class="logo-wrapper">
          <img src="Images/Logo.png" alt="HASA Promotion Logo">
        </div>
        <div class="content-wrapper">
          <h1>Jouez. Explorez. Investissez.</h1>
          <p>Découvrez tous nos biens disponibles comme vous n'en avez jamais vu et tentez votre chance pour gagner de nombreux cadeaux.</p>
          <a class="btn-download" href="livre-blanc.html">Téléchargez le livre blanc</a>
        </div>
      </div>
    </section>

    <div class="band-white-mid"></div>

    <nav class="nav-section">
      <button class="nav-arrow" aria-label="Précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="nav-arrow" aria-label="Suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </nav>

  </div>
</body>
</html>
